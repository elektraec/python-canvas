<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Prueba de Escritorio · B26</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">✎</div>
      <div>
        <h1>Prueba de Escritorio</h1>
        <p>Programación · B26</p>
      </div>
    </div>

    <div class="progress-card">
      <div class="progress-row"><span>Progreso</span><b id="doneText">0/0</b></div>
      <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
    </div>

    <nav class="topic-nav" id="topicNav"></nav>

    <div class="sidebar-actions">
      <button class="side-btn" id="exportBtn">⬇ Exportar</button>
      <button class="side-btn" id="resetBtn">↺ Reiniciar</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <button class="btn menu-btn" id="menuBtn">☰</button>
        <button class="btn" id="homeBtn">Inicio</button>
      </div>
      <div class="statbar">
        <span class="pill">Práctica individual</span>
        <span class="pill" id="xpText">0 XP</span>
      </div>
    </header>

    <div class="content" id="content"></div>
  </main>
</div>
<div class="version">B26-ESCRITORIO-v3</div>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
